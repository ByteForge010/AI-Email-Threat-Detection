<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Email Threat Report</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172b4d;
        }

        .header {
            background: #102b52;
            color: white;
            padding: 22px 60px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            margin: 0;
            font-size: 32px;
        }

        .title p {
            color: #667085;
        }

        .report-card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .filename {
            background: #eef4ff;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .report {
            background: #f8fafc;
            border: 1px solid #e4e7ec;
            border-radius: 10px;
            padding: 25px;
            white-space: pre-wrap;
            font-family: Consolas, monospace;
            line-height: 1.7;
            overflow-x: auto;
        }

        .error {
            background: #fff1f0;
            border: 1px solid #ffccc7;
            color: #b42318;
            padding: 20px;
            border-radius: 10px;
            white-space: pre-wrap;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .button {
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            background: #1769e0;
        }

        .download {
            background: #102b52;
        }

    </style>

</head>


<body>

    <div class="header">
        EMAIL THREAT DETECTION
    </div>


    <div class="container">

        <div class="title">

            <h1>
                Email Analysis Report
            </h1>

            <p>
                Threat detection and forensic intelligence
            </p>

        </div>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% else %}

            <div class="report-card">

                <div class="filename">

                    Report:
                    {{ report_name }}

                </div>


                <div class="report">

                    {{ report }}

                </div>


                <div class="buttons">

                    <a
                        href="/"
                        class="button"
                    >
                        Analyze Another Email
                    </a>


                    <a
                        href="/download-report"
                        class="button download"
                    >
                        Download Report
                    </a>

                </div>

            </div>

        {% endif %}

    </div>

</body>

</html>
